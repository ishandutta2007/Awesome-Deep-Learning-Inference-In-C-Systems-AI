<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#070a16" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
        50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.45; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes streamPulse {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-glow {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .badge-float {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 20, 10;
        animation: streamPulse 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1280" height="440" fill="url(#bgGradient)" />
  <rect width="1280" height="440" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad)" class="orb-glow" filter="url(#glow)" />
  <circle cx="1100" cy="320" r="220" fill="url(#glowGrad)" class="orb-glow" filter="url(#glow)" />

  <!-- Dynamic Hardware/Tensor Stream Lines -->
  <path d="M -50 360 C 300 360, 450 400, 700 350 C 950 300, 1100 380, 1330 360" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.35" class="stream-line" />
  <path d="M -50 80 C 250 80, 400 40, 650 90 C 900 140, 1050 60, 1330 80" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.25" class="stream-line" />

  <!-- Architecture Flow Elements in Background -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <polygon points="100,260 140,230 180,260 140,290" />
    <line x1="180" y1="260" x2="240" y2="260" />
    <circle cx="260" cy="260" r="20" />
    <line x1="280" y1="260" x2="340" y2="260" />
    <rect x="340" y="240" width="40" height="40" rx="6" />

    <rect x="920" y="160" width="46" height="36" rx="6" />
    <line x1="966" y1="178" x2="1010" y2="178" />
    <polygon points="1010,178 1030,165 1050,178 1030,191" />
    <line x1="1050" y1="178" x2="1090" y2="178" />
    <circle cx="1110" cy="178" r="18" />
  </g>

  <!-- Foreground Title and Content -->
  <!-- Top Pill -->
  <g class="badge-float" transform="translate(640, 50)">
    <rect x="-130" y="0" width="260" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="0" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ LOW-LEVEL SYSTEMS AI</text>
  </g>

  <!-- Main Titles -->
  <text x="640" y="150" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome Deep Learning Inference
  </text>
  <text x="640" y="205" text-anchor="middle" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    in C / C++ &amp; Systems AI
  </text>

  <!-- Subtitle -->
  <text x="640" y="255" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    Zero-Dependency C/C++ Kernels • Quantized Tensor Engines • Edge Compilers • Bare-Metal Runtimes
  </text>

  <!-- Feature Tech Pills -->
  <g transform="translate(640, 315)">
    <!-- Pill 1: llama.cpp / ggml -->
    <g transform="translate(-360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🦙 llama.cpp &amp; GGML</text>
    </g>
    <!-- Pill 2: Pure C Engines -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🚀 llm.c &amp; llama2.c</text>
    </g>
    <!-- Pill 3: Compilers -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚙️ TVM &amp; ONNX</text>
    </g>
    <!-- Pill 4: Mobile & Edge -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📱 ExecuTorch &amp; ncnn</text>
    </g>
    <!-- Pill 5: SIMD & CUDA -->
    <g transform="translate(360, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ AVX/NEON/CUDA</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="436" width="1280" height="4" fill="url(#accentGrad)" />
</svg>